version: "3.8"

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      # Optional SSH volume (only used if SSH keys are available)
      - devcontainer-ssh:/home/vscode/.ssh
    command: sleep infinity
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=1
      - MSSQL_SA_PASSWORD=YourStr0ngP@ssword
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

volumes:
  devcontainer-ssh:
  azurite-data:
  sql-data:
